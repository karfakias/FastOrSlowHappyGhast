name: Publish to Modrinth

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Upload to Modrinth after a successful build
        type: boolean
        default: false
      changelog:
        description: Release notes for this version
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: modrinth-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read and validate release metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          properties = {}
          for line in Path('gradle.properties').read_text().splitlines():
              if '=' in line and not line.lstrip().startswith('#'):
                  key, value = line.split('=', 1)
                  properties[key.strip()] = value.strip()
          version = properties['mod_version']
          tag = os.environ.get('RELEASE_TAG', '')
          if tag and tag.removeprefix('v') != version:
              raise SystemExit(f'Release tag {tag} does not match mod_version {version}')
          jar = f"build/libs/{properties['archives_base_name']}-{version}.jar"
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'version={version}', file=output)
              print(f'minecraft={properties["minecraft_version"]}', file=output)
              print(f'jar={jar}', file=output)
          PY

      - name: Check publishing credentials
        if: github.event_name == 'release' || inputs.publish
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
        run: |
          test -n "$MODRINTH_TOKEN" || { echo '::error::Add the MODRINTH_TOKEN repository secret.'; exit 1; }
          test -n "$MODRINTH_PROJECT_ID" || { echo '::error::Add the MODRINTH_PROJECT_ID repository variable.'; exit 1; }

      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build and test
        run: bash ./gradlew --no-daemon clean build

      - name: Verify mod JAR
        env:
          MOD_JAR: ${{ steps.metadata.outputs.jar }}
        run: test -s "$MOD_JAR"

      - name: Upload to Modrinth
        if: github.event_name == 'release' || inputs.publish
        uses: cloudnode-pro/modrinth-publish@3870f66007063f03fb70118ca9eddbc09a4ba666 # v2.5.2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: ${{ vars.MODRINTH_PROJECT_ID }}
          name: Fast or Slow Happy Ghast ${{ steps.metadata.outputs.version }}
          version: ${{ steps.metadata.outputs.version }}
          changelog: ${{ github.event.release.body || inputs.changelog }}
          channel: ${{ github.event.release.prerelease && 'beta' || 'release' }}
          loaders: fabric
          game-versions: ${{ steps.metadata.outputs.minecraft }}
          environment: server_only
          files: ${{ steps.metadata.outputs.jar }}
